name: Build and Push Docker Image for Imesy IA Service

on:
  push:
    branches:
      - imasy-ia

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract repository name
        run: echo "REPO_NAME=imesy-ia" >> $GITHUB_ENV

      - name: Extract repository target
        run: echo "REPO_TARGET=v1.0.0" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.REPO_TARGET }} .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.REPO_TARGET }}

      - name: Notify success
        if: success()
        run: echo "✅ Image poussée avec succès sur Docker Hub"

      - name: Notify failure
        if: failure()
        run: echo "❌ Échec du build/push de l'image Docker"
